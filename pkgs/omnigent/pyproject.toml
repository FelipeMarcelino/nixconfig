# Workspace "virtual" usado apenas para travar as versoes do omnigent via uv.lock.
# Para atualizar a versao:
#   cd pkgs/omnigent && nix run nixpkgs#uv -- lock --upgrade
[project]
name = "omnigent-env"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["omnigent==0.11.0"]

[tool.uv]
package = false
